<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <script src="js/ArticleCard.js" defer></script>
  </head>

  <body>

    <div id="header">
      <div id="profile">
        <div id="profile-info">
          <h3 id="profile-name">Name: </h3>
          <h4 id="profile-age">Age: </h4>
          <h4 id="profile-bio">Bio: </h4>
        </div>
        <input id="profile-picture" alt="Profile picture" type="image" src="assets/person-circle.svg"></input>
      </div>
    </div>

    <div id="articles">
      <h1 id="recent-heading" style="margin-left: 1rem;">Recent</h1>
    </div>

    <div id="post-input">
      <input class="input-box" id="title-box" placeholder="Title"></input>
      <input class="input-box" id="content-box" placeholder="What's on your mind?"></input>
      <div id="post-button-div">
        <button id="post-button">Post</button>
      </div>
    </div>

    <div id="footer">
      <h5 id="footer-message">Cat to Human translator coming soon...</h5>
    </div>
  
  </body>

</html>
